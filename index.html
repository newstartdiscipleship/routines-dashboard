<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Routines</title>
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #eceef1;
    --text: #14161a;
    --text-dim: #5b6270;
    --accent: #3b6ef6;
    --accent-text: #ffffff;
    --border: #dadde2;
    --danger: #d63838;
    --focus: #3b6ef6;
    --shadow: 0 1px 2px rgba(15,23,42,0.04), 0 6px 16px rgba(15,23,42,0.06);
    --cat-miracle: #b45309;
    --cat-kids: #0f766e;
    --cat-blitz: #b91c1c;
    --cat-christmas: #15803d;
    --cat-devotions: #6d28d9;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --surface: #1e2127;
      --surface-2: #262a32;
      --text: #f2f3f5;
      --text-dim: #9ba1ad;
      --accent: #6d94ff;
      --accent-text: #0d1117;
      --border: #33373f;
      --danger: #ff6b6b;
      --focus: #6d94ff;
      --shadow: none;
      --cat-miracle: #fbbf24;
      --cat-kids: #2dd4bf;
      --cat-blitz: #f87171;
      --cat-christmas: #4ade80;
      --cat-devotions: #a78bfa;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom);
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 16px calc(40px + env(safe-area-inset-bottom));
  }

  header.topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 0 12px;
    min-height: 44px;
  }

  header.topbar h1 {
    font-size: 1.3rem;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0;
    flex: 1;
  }

  main h1 {
    letter-spacing: -0.01em;
    font-weight: 800;
  }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 1.1rem;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.08s ease, background 0.08s ease;
  }
  .icon-btn:active { background: var(--surface-2); transform: scale(0.94); }
  .icon-btn:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: var(--accent);
    font-size: 1rem;
    font-weight: 600;
    padding: 8px 4px 8px 0;
    cursor: pointer;
    min-height: 44px;
  }

  .card-list, .routine-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .cat-card {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--cat-accent, var(--border));
    border-radius: 18px;
    padding: 20px 22px;
    min-height: 88px;
    color: var(--text);
    font-family: inherit;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.08s ease, background 0.08s ease;
  }
  .cat-card:active { background: var(--surface-2); transform: scale(0.985); }
  .cat-card .cat-name { font-size: 1.2rem; font-weight: 700; }
  .cat-card .cat-meta { font-size: 0.9rem; color: var(--text-dim); }
  .cat-card .cat-today {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    color: var(--cat-accent, var(--accent));
    font-weight: 700;
    margin-top: 2px;
  }
  .cat-card .cat-today::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }

  .section-heading {
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin: 22px 0 10px;
  }
  .section-heading:first-child { margin-top: 0; }

  .routine-btn {
    display: block;
    width: 100%;
    min-height: 64px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 16px 20px;
    color: var(--text);
    text-decoration: none;
    font-family: inherit;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.08s ease, background 0.08s ease;
  }
  .routine-btn:active { background: var(--surface-2); transform: scale(0.985); }
  .routine-btn .r-name { font-size: 1.05rem; font-weight: 700; display: block; }
  .routine-btn .r-sub { font-size: 0.88rem; color: var(--text-dim); display: block; margin-top: 2px; }

  .routine-btn.primary {
    background: var(--cat-accent, var(--accent));
    border-color: var(--cat-accent, var(--accent));
    padding: 20px 20px;
    min-height: 76px;
  }
  .routine-btn.primary .r-name { color: var(--accent-text); font-size: 1.2rem; }
  .routine-btn.primary .r-sub { color: var(--accent-text); opacity: 0.85; }
  .routine-btn.primary:active { filter: brightness(0.92); transform: scale(0.985); }

  .empty-state {
    color: var(--text-dim);
    padding: 24px 4px;
    font-size: 0.95rem;
  }

  .month-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .month-tile {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: 2px;
    min-height: 64px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 12px 14px;
    color: var(--text);
    font-family: inherit;
    cursor: pointer;
    text-align: left;
    box-shadow: var(--shadow);
    transition: transform 0.08s ease, background 0.08s ease;
  }
  .month-tile:active { background: var(--surface-2); transform: scale(0.985); }
  .month-tile .m-name { font-size: 0.98rem; font-weight: 700; }
  .month-tile .m-count { font-size: 0.78rem; color: var(--text-dim); }

  .month-tile.primary {
    grid-column: 1 / -1;
    background: var(--cat-accent, var(--accent));
    border-color: var(--cat-accent, var(--accent));
    min-height: 76px;
    padding: 18px 20px;
  }
  .month-tile.primary .m-name { color: var(--accent-text); font-size: 1.2rem; }
  .month-tile.primary .m-count { color: var(--accent-text); opacity: 0.85; }
  .month-tile.primary:active { filter: brightness(0.92); transform: scale(0.985); }

  /* Edit screen */
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .field input[type=text], .field select, .field textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 1rem;
    font-family: inherit;
  }
  .field textarea { min-height: 100px; resize: vertical; }

  .day-picker {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .day-chip {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 999px;
    padding: 8px 0;
    width: 44px;
    text-align: center;
    font-size: 0.85rem;
    cursor: pointer;
    font-family: inherit;
  }
  .day-chip[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
    font-weight: 700;
  }

  .routine-edit-row, .panel-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .routine-edit-row .row-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .routine-edit-row .row-title { font-weight: 700; }
  .row-actions { display: flex; gap: 6px; }
  .row-actions button {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    width: 36px;
    height: 36px;
    font-size: 0.95rem;
    cursor: pointer;
    font-family: inherit;
  }
  .row-actions button.danger { color: var(--danger); }

  details.routine-details summary {
    cursor: pointer;
    color: var(--accent);
    font-size: 0.9rem;
    font-weight: 600;
    padding: 6px 0;
    list-style: none;
  }
  details.routine-details summary::-webkit-details-marker { display: none; }
  details.routine-details[open] summary { margin-bottom: 10px; }

  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    padding: 12px 16px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    min-height: 44px;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn.danger { color: var(--danger); border-color: var(--danger); background: var(--surface); }
  .btn:active { filter: brightness(0.95); }

  .add-routine-btn {
    width: 100%;
    border: 1px dashed var(--border);
    background: none;
    color: var(--accent);
    border-radius: 14px;
    padding: 16px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    min-height: 56px;
    margin-top: 4px;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 0.9rem;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 50;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  [hidden] { display: none !important; }
</style>
</head>

    { id: "apr-devo-1", category: "devotions", name: "April Devotion 1", subtitle: "", url: "https://music.youtube.com/playlist?list=PLDY9vsZpaib-_bdm_mctcHsHDn-SpwAnL", month: 4, speakerGroup: "" },
    { id: "apr-devo-2", category: "devotions", name: "April Devotion 2", subtitle: "", url: "https://music.youtube.com/playlist?list=PLDY9vsZpaib_knQ8tdjrXZfVL9gUe7a49", month: 4, speakerGroup: "" },
    { id: "may-devo-1", category: "devotions", name: "May Devotion 1", subtitle: "", url: "https://music.youtube.com/playlist?list=PLDY9vsZpaib_QkgW5iVioeDDwVfDxdTnu", month: 5, speakerGroup: "" },
    { id: "may-devo-2", category: "devotions", name: "May Devotion 2", subtitle: "", url: "https://music.youtube.com/playlist?list=PLDY9vsZpaib_ePNVv47e64zJYH5seZ_PD", month: 5, speakerGroup: "" },
    { id: "jun-devo-1", category: "devotions", name: "June Devotion 1", subtitle: "", url: "https://music.youtube.com/playlist?list=PLDY9vsZpaib-6reGlPpm2W0rkxxSEVypv", month: 6, speakerGroup: "" },
    { id: "jun-devo-2", category: "devotions", name: "June Devotion 2", subtitle: "", url: "https://music.youtube.com/playlist?list=PLDY9vsZpaib8vkTzmAOr9cw94YgSLMQ-7", month: 6, speakerGroup: "" }
  ];

  var MONTH_NAMES = ["January", "February", "March", "April", "May", "June",
    "July", "August", "September", "October", "November", "December"];

  var DAY_LABELS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

  // ---------- storage ----------

  function loadRoutines() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return clone(DEFAULT_ROUTINES);
      var parsed = JSON.parse(raw);
      if (!Array.isArray(parsed) || parsed.length === 0) return clone(DEFAULT_ROUTINES);
      return parsed;
    } catch (e) {
      return clone(DEFAULT_ROUTINES);
    }
  }

  function saveRoutines(routines) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(routines));
      return true;
    } catch (e) {
      return false;
    }
  }

  function clone(x) { return JSON.parse(JSON.stringify(x)); }

  function validCategoryId(catId) {
    return CATEGORIES.some(function (c) { return c.id === catId; });
  }

  function effectiveCategory(routine) {
    if (routine.category && validCategoryId(routine.category)) return routine.category;
    return CATEGORIES[0].id;
  }

  function uid() {
    return "r-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
  }

  // ---------- URL normalization ----------

  function normalizePlaylistUrl(input) {
    if (!input) return "";
    var s = input.trim();
    if (!s) return "";

    // bare playlist id (YouTube playlist IDs are typically alnum + _ -)
    // defaults to YouTube Music since that's the common case; a full URL
    // (see below) keeps whichever YouTube surface it was pasted from.
    if (/^[A-Za-z0-9_-]+$/.test(s) && !/^https?:/i.test(s)) {
      return "https://music.youtube.com/playlist?list=" + s;
    }

    try {
      var u = new URL(s);
      var list = u.searchParams.get("list");
      if (list) {
        var isMusic = /(^|\.)music\.youtube\.com$/i.test(u.hostname);
        var host = isMusic ? "music.youtube.com" : "www.youtube.com";
        return "https://" + host + "/playlist?list=" + list;
      }
      return s;
    } catch (e) {
      return s;
    }
  }

  // ---------- state / router ----------

  var state = {
    routines: loadRoutines(),
    screen: "categories", // categories | routines | devotion-months | devotion-routines | edit
    activeCategory: null,
    activeMonth: null
  };

  function render() {
    var app = document.getElementById("app");
    app.innerHTML = "";
    app.style.removeProperty("--cat-accent");
    if (state.screen === "categories") {
      app.appendChild(renderCategoriesScreen());
    } else if (state.screen === "routines") {
      setAppAccent(state.activeCategory);
      app.appendChild(renderRoutinesScreen(state.activeCategory));
    } else if (state.screen === "devotion-months") {
      setAppAccent(state.activeCategory);
      app.appendChild(renderDevotionMonthsScreen(state.activeCategory));
    } else if (state.screen === "devotion-routines") {
      setAppAccent(state.activeCategory);
      app.appendChild(renderDevotionRoutinesScreen(state.activeCategory, state.activeMonth));
    } else if (state.screen === "edit") {
      app.appendChild(renderEditScreen());
    }
  }

  // Category ids with a matching --cat-<id> color defined in CSS. A category
  // added without one just falls back to the neutral border/accent colors.
  var CATEGORY_ACCENT_IDS = ["miracle", "kids", "blitz", "christmas", "devotions"];

  function setAppAccent(catId) {
    var app = document.getElementById("app");
    if (catId && CATEGORY_ACCENT_IDS.indexOf(catId) !== -1) {
      app.style.setProperty("--cat-accent", "var(--cat-" + catId + ")");
    }
  }

  function navigate(screen, params, opts) {
    params = params || {};
    opts = opts || {};
    var historyState = {
      screen: screen,
      categoryId: params.categoryId || null,
      month: params.month || null
    };
    state.screen = historyState.screen;
    state.activeCategory = historyState.categoryId;
    state.activeMonth = historyState.month;
    if (!opts.replace) {
      history.pushState(historyState, "", "");
    } else {
      history.replaceState(historyState, "", "");
    }
    render();
    window.scrollTo(0, 0);
  }

  window.addEventListener("popstate", function (e) {
    var s = e.state || { screen: "categories", categoryId: null, month: null };
    state.screen = s.screen;
    state.activeCategory = s.categoryId;
    state.activeMonth = s.month || null;
    render();
    window.scrollTo(0, 0);
  });

  // ---------- today / this-month logic ----------

  function todayIndex() {
    return new Date().getDay();
  }

  function isToday(routine) {
    return Array.isArray(routine.days) && routine.days.indexOf(todayIndex()) !== -1;
  }

  function currentMonth() {
    return new Date().getMonth() + 1; // 1-12
  }

  function categoryMode(cat) {
    return cat && cat.mode === "month" ? "month" : "weekday";
  }

  function routinesForCategory(catId) {
    return state.routines.filter(function (r) { return effectiveCategory(r) === catId; });
  }

  // ---------- screen: categories ----------

  function renderCategoriesScreen() {
    var frag = document.createDocumentFragment();

    var header = el("header", { class: "topbar" });
    header.appendChild(el("h1", {}, "Routines"));
    var gear = el("button", { class: "icon-btn", "aria-label": "Edit routines", type: "button" }, "⚙️");
    gear.addEventListener("click", function () { navigate("edit"); });
    header.appendChild(gear);
    frag.appendChild(header);

    var list = el("div", { class: "card-list" });

    CATEGORIES.forEach(function (cat) {
      var routines = routinesForCategory(cat.id);
      var mode = categoryMode(cat);

      var card = el("button", { class: "cat-card", type: "button" });
      if (CATEGORY_ACCENT_IDS.indexOf(cat.id) !== -1) {
        card.style.setProperty("--cat-accent", "var(--cat-" + cat.id + ")");
      }
      card.appendChild(el("span", { class: "cat-name" }, cat.name));
      var count = routines.length;
      card.appendChild(el("span", { class: "cat-meta" }, count + (count === 1 ? " routine" : " routines")));

      if (mode === "month") {
        var thisMonth = routines.filter(function (r) { return r.month === currentMonth(); });
        if (thisMonth.length > 0) {
          var mLabel = thisMonth.length === 1 ? ("This month: " + thisMonth[0].name) : (thisMonth.length + " for this month");
          card.appendChild(el("span", { class: "cat-today" }, mLabel));
        }
      } else {
        var todays = routines.filter(isToday);
        if (todays.length > 0) {
          var label = todays.length === 1 ? ("Today: " + todays[0].name) : (todays.length + " for today");
          card.appendChild(el("span", { class: "cat-today" }, label));
        }
      }

      card.addEventListener("click", function () {
        if (mode === "month") {
          navigate("devotion-months", { categoryId: cat.id });
        } else {
          navigate("routines", { categoryId: cat.id });
        }
      });
      list.appendChild(card);
    });

    frag.appendChild(list);
    return frag;
  }

  // ---------- screen: routines ----------

  function renderRoutinesScreen(catId) {
    var frag = document.createDocumentFragment();
    var cat = CATEGORIES.find(function (c) { return c.id === catId; }) || CATEGORIES[0];

    var header = el("header", { class: "topbar" });
    var back = el("button", { class: "back-btn", type: "button" }, "‹ Back");
    back.addEventListener("click", function () { navigate("categories", null); });
    frag.appendChild(back);

    var h1 = el("h1", { style: "font-size:1.3rem; margin: 4px 0 20px;" }, cat.name);
    frag.appendChild(h1);

    var routines = routinesForCategory(cat.id);

    if (routines.length === 0) {
      frag.appendChild(el("div", { class: "empty-state" }, "No routines in this category yet. Add one from the edit screen."));
      return frag;
    }

    var today = routines.filter(isToday);
    var rest = routines.filter(function (r) { return !isToday(r); });

    if (today.length > 0) {
      frag.appendChild(el("div", { class: "section-heading" }, "Today"));
      var todayList = el("div", { class: "routine-list" });
      today.forEach(function (r) { todayList.appendChild(renderRoutineButton(r, true)); });
      frag.appendChild(todayList);

      frag.appendChild(el("div", { class: "section-heading" }, "All routines"));
      var restList = el("div", { class: "routine-list" });
      rest.forEach(function (r) { restList.appendChild(renderRoutineButton(r, false)); });
      frag.appendChild(restList);
    } else {
      var list = el("div", { class: "routine-list" });
      routines.forEach(function (r) { list.appendChild(renderRoutineButton(r, false)); });
      frag.appendChild(list);
    }

    return frag;
  }

  // ---------- screen: devotion months (month-mode category, level 2) ----------

  function renderDevotionMonthsScreen(catId) {
    var frag = document.createDocumentFragment();
    var cat = CATEGORIES.find(function (c) { return c.id === catId; }) || CATEGORIES[0];
    var routines = routinesForCategory(cat.id);
    var thisMonth = currentMonth();

    var back = el("button", { class: "back-btn", type: "button" }, "‹ Back");
    back.addEventListener("click", function () { navigate("categories", null); });
    frag.appendChild(back);

    frag.appendChild(el("h1", { style: "font-size:1.3rem; margin: 4px 0 14px;" }, cat.name));

    function countFor(m) {
      return routines.filter(function (r) { return r.month === m; }).length;
    }

    frag.appendChild(el("div", { class: "section-heading" }, "This Month"));
    var pinnedGrid = el("div", { class: "month-grid" });
    pinnedGrid.appendChild(renderMonthTile(cat.id, thisMonth, countFor(thisMonth), true));
    frag.appendChild(pinnedGrid);

    frag.appendChild(el("div", { class: "section-heading" }, "All Months"));
    var grid = el("div", { class: "month-grid" });
    for (var m = 1; m <= 12; m++) {
      if (m === thisMonth) continue;
      grid.appendChild(renderMonthTile(cat.id, m, countFor(m), false));
    }
    frag.appendChild(grid);

    return frag;
  }

  function renderMonthTile(catId, month, count, primary) {
    var tile = el("button", { class: "month-tile" + (primary ? " primary" : ""), type: "button" });
    tile.appendChild(el("span", { class: "m-name" }, MONTH_NAMES[month - 1]));
    tile.appendChild(el("span", { class: "m-count" }, count + (count === 1 ? " playlist" : " playlists")));
    tile.addEventListener("click", function () { navigate("devotion-routines", { categoryId: catId, month: month }); });
    return tile;
  }

  // ---------- screen: devotion routines (month-mode category, level 3) ----------

  function renderDevotionRoutinesScreen(catId, month) {
    var frag = document.createDocumentFragment();
    var cat = CATEGORIES.find(function (c) { return c.id === catId; }) || CATEGORIES[0];

    var back = el("button", { class: "back-btn", type: "button" }, "‹ Back");
    back.addEventListener("click", function () { navigate("devotion-months", { categoryId: catId }); });
    frag.appendChild(back);

    frag.appendChild(el("h1", { style: "font-size:1.3rem; margin: 4px 0 20px;" }, MONTH_NAMES[month - 1] + " " + cat.name));

    var routines = routinesForCategory(catId).filter(function (r) { return r.month === month; });

    if (routines.length === 0) {
      frag.appendChild(el("div", { class: "empty-state" }, "No playlists for " + MONTH_NAMES[month - 1] + " yet. Add one from the edit screen."));
      return frag;
    }

    var list = el("div", { class: "routine-list" });
    routines.forEach(function (r) { list.appendChild(renderRoutineButton(r, false)); });
    frag.appendChild(list);

    return frag;
  }

  function renderRoutineButton(routine, primary) {
    var a = el("a", {
      class: "routine-btn" + (primary ? " primary" : ""),
      href: routine.url || "#"
    });
    a.appendChild(el("span", { class: "r-name" }, routine.name || "(untitled)"));
    if (routine.subtitle) {
      a.appendChild(el("span", { class: "r-sub" }, routine.subtitle));
    }
    if (!routine.url) {
      a.addEventListener("click", function (e) { e.preventDefault(); showToast("No playlist URL set for this routine yet."); });
    }
    return a;
  }

  // ---------- screen: edit ----------

  function renderEditScreen() {
    var frag = document.createDocumentFragment();

    var back = el("button", { class: "back-btn", type: "button" }, "‹ Back");
    back.addEventListener("click", function () { navigate("categories", null); });
    frag.appendChild(back);

    frag.appendChild(el("h1", { style: "font-size:1.3rem; margin: 4px 0 18px;" }, "Edit Routines"));

    CATEGORIES.forEach(function (cat) {
      frag.appendChild(el("div", { class: "section-heading" }, cat.name));
      var routines = routinesForCategory(cat.id);

      if (routines.length === 0) {
        frag.appendChild(el("div", { class: "empty-state", style: "padding: 4px 4px 8px;" }, "No routines yet."));
      }

      routines.forEach(function (routine, idxInCat) {
        frag.appendChild(renderEditRow(routine, idxInCat, routines.length));
      });

      var addBtn = el("button", { class: "add-routine-btn", type: "button" }, "+ Add routine to " + cat.name);
      addBtn.addEventListener("click", function () { addRoutine(cat.id); });
      frag.appendChild(addBtn);
    });

    // Import / export
    frag.appendChild(el("div", { class: "section-heading", style: "margin-top:30px;" }, "Backup"));
    var backupWrap = el("div", { class: "panel-box" });
    backupWrap.appendChild(el("div", { style: "font-size:0.9rem; color:var(--text-dim); margin-bottom:12px;" },
      "Export your config to move it to another device, or paste one in to restore it."));

    var btnRow = el("div", { class: "btn-row" });
    var exportBtn = el("button", { class: "btn", type: "button" }, "Copy config to clipboard");
    exportBtn.addEventListener("click", exportConfig);
    var importBtn = el("button", { class: "btn", type: "button" }, "Paste config in");
    importBtn.addEventListener("click", function () { toggleImportBox(backupWrap); });
    btnRow.appendChild(exportBtn);
    btnRow.appendChild(importBtn);
    backupWrap.appendChild(btnRow);

    var importField = el("div", { class: "field", id: "import-field", hidden: "" });
    importField.appendChild(el("label", { for: "import-textarea" }, "Paste JSON config"));
    var ta = el("textarea", { id: "import-textarea", placeholder: "[ { \"id\": ... } ]" });
    importField.appendChild(ta);
    var applyBtn = el("button", { class: "btn primary", type: "button", style: "margin-top:10px;" }, "Apply pasted config");
    applyBtn.addEventListener("click", function () { importConfig(ta.value); });
    importField.appendChild(applyBtn);
    backupWrap.appendChild(importField);

    frag.appendChild(backupWrap);

    // Reset
    var resetBtn = el("button", { class: "btn danger", type: "button", style: "margin-top:18px;" }, "Reset to defaults");
    resetBtn.addEventListener("click", function () {
      if (confirm("Reset all routines to the built-in defaults? This discards your edits.")) {
        state.routines = clone(DEFAULT_ROUTINES);
        saveRoutines(state.routines);
        render();
        showToast("Reset to defaults.");
      }
    });
    frag.appendChild(resetBtn);

    return frag;
  }

  function toggleImportBox(container) {
    var box = container.querySelector("#import-field");
    box.hidden = !box.hidden;
  }

  function renderEditRow(routine, idxInCat, catLen) {
    var row = el("div", { class: "routine-edit-row" });

    var top = el("div", { class: "row-top" });
    top.appendChild(el("span", { class: "row-title" }, routine.name || "(untitled)"));

    var actions = el("div", { class: "row-actions" });
    var upBtn = el("button", { type: "button", "aria-label": "Move up", disabled: idxInCat === 0 ? "" : null }, "↑");
    if (idxInCat === 0) upBtn.disabled = true;
    upBtn.addEventListener("click", function () { moveRoutine(routine.id, -1); });
    var downBtn = el("button", { type: "button", "aria-label": "Move down" }, "↓");
    if (idxInCat === catLen - 1) downBtn.disabled = true;
    downBtn.addEventListener("click", function () { moveRoutine(routine.id, 1); });
    var delBtn = el("button", { type: "button", class: "danger", "aria-label": "Delete routine" }, "✕");
    delBtn.addEventListener("click", function () {
      if (confirm("Delete \"" + (routine.name || "this routine") + "\"?")) {
        deleteRoutine(routine.id);
      }
    });
    actions.appendChild(upBtn);
    actions.appendChild(downBtn);
    actions.appendChild(delBtn);
    top.appendChild(actions);
    row.appendChild(top);

    var details = el("details", { class: "routine-details" });
    var summary = el("summary", {}, "Edit details");
    details.appendChild(summary);

    var form = el("div");

    form.appendChild(field("Name", textInput(routine.id + "-name", routine.name || "", function (v) {
      updateRoutine(routine.id, { name: v });
    })));

    form.appendChild(field("Subtitle (optional)", textInput(routine.id + "-sub", routine.subtitle || "", function (v) {
      updateRoutine(routine.id, { subtitle: v });
    })));

    form.appendChild(field("Playlist URL or ID", textInput(routine.id + "-url", routine.url || "", function (v) {
      updateRoutine(routine.id, { url: normalizePlaylistUrl(v) });
    }, "https://music.youtube.com/playlist?list=...")));

    form.appendChild(field("Cast target", textInput(routine.id + "-speaker", routine.speakerGroup || "", function (v) {
      updateRoutine(routine.id, { speakerGroup: v });
    }, "e.g. Whole House, or a TV for video playlists")));

    // category picker
    var catField = el("div", { class: "field" });
    catField.appendChild(el("label", { for: routine.id + "-cat" }, "Category"));
    var select = el("select", { id: routine.id + "-cat" });
    CATEGORIES.forEach(function (c) {
      var opt = el("option", { value: c.id }, c.name);
      if (effectiveCategory(routine) === c.id) opt.selected = true;
      select.appendChild(opt);
    });
    select.addEventListener("change", function () {
      var patch = { category: select.value };
      var newCat = CATEGORIES.find(function (c) { return c.id === select.value; });
      if (categoryMode(newCat) === "month" && !routine.month) patch.month = currentMonth();
      updateRoutine(routine.id, patch);
    });
    catField.appendChild(select);
    form.appendChild(catField);

    // day picker (weekday-mode categories) or month picker (month-mode categories)
    var currentCat = CATEGORIES.find(function (c) { return c.id === effectiveCategory(routine); });
    if (categoryMode(currentCat) === "month") {
      var monthField = el("div", { class: "field" });
      monthField.appendChild(el("label", { for: routine.id + "-month" }, "Month"));
      var monthSelect = el("select", { id: routine.id + "-month" });
      MONTH_NAMES.forEach(function (name, idx) {
        var opt = el("option", { value: String(idx + 1) }, name);
        if (routine.month === idx + 1) opt.selected = true;
        monthSelect.appendChild(opt);
      });
      monthSelect.addEventListener("change", function () {
        updateRoutine(routine.id, { month: parseInt(monthSelect.value, 10) });
      });
      monthField.appendChild(monthSelect);
      form.appendChild(monthField);
    } else {
      var dayField = el("div", { class: "field" });
      dayField.appendChild(el("label", {}, "Scheduled days"));
      var dayPicker = el("div", { class: "day-picker" });
      var currentDays = Array.isArray(routine.days) ? routine.days.slice() : [];
      DAY_LABELS.forEach(function (label, idx) {
        var pressed = currentDays.indexOf(idx) !== -1;
        var chip = el("button", { type: "button", class: "day-chip", "aria-pressed": pressed ? "true" : "false" }, label);
        chip.addEventListener("click", function () {
          var days = Array.isArray(routine.days) ? routine.days.slice() : [];
          var pos = days.indexOf(idx);
          if (pos === -1) days.push(idx); else days.splice(pos, 1);
          updateRoutine(routine.id, { days: days });
          chip.setAttribute("aria-pressed", pos === -1 ? "true" : "false");
        });
        dayPicker.appendChild(chip);
      });
      dayField.appendChild(dayPicker);
      form.appendChild(dayField);
    }

    details.appendChild(form);
    row.appendChild(details);

    return row;
  }

  function field(labelText, inputEl) {
    var wrap = el("div", { class: "field" });
    var label = el("label", {}, labelText);
    wrap.appendChild(label);
    wrap.appendChild(inputEl);
    return wrap;
  }

  function textInput(id, value, onChange, placeholder) {
    var input = el("input", { type: "text", id: id, value: value });
    if (placeholder) input.setAttribute("placeholder", placeholder);
    input.addEventListener("change", function () { onChange(input.value); });
    return input;
  }

  // ---------- mutations ----------

  function updateRoutine(id, patch) {
    var idx = state.routines.findIndex(function (r) { return r.id === id; });
    if (idx === -1) return;
    Object.assign(state.routines[idx], patch);
    saveRoutines(state.routines);
    // re-render only the row's title in place would be nicer, but a full
    // re-render is simple and this screen is small; avoid it on every
    // keystroke by only re-rendering on 'change', not 'input'.
    renderInPlaceLabelUpdate(id, patch);
  }

  function renderInPlaceLabelUpdate(id, patch) {
    if (patch.name !== undefined) {
      var routine = state.routines.find(function (r) { return r.id === id; });
      var rows = document.querySelectorAll(".routine-edit-row");
      rows.forEach(function (row) {
        var nameInput = row.querySelector("input[id='" + id + "-name']");
        if (nameInput) {
          var titleSpan = row.querySelector(".row-title");
          if (titleSpan) titleSpan.textContent = routine.name || "(untitled)";
        }
      });
    }
    if (patch.category !== undefined) {
      render();
    }
  }

  function moveRoutine(id, dir) {
    var routine = state.routines.find(function (r) { return r.id === id; });
    if (!routine) return;
    var catId = effectiveCategory(routine);
    var inCat = state.routines.filter(function (r) { return effectiveCategory(r) === catId; });
    var pos = inCat.findIndex(function (r) { return r.id === id; });
    var newPos = pos + dir;
    if (newPos < 0 || newPos >= inCat.length) return;

    var a = inCat[pos];
    var b = inCat[newPos];
    var globalA = state.routines.indexOf(a);
    var globalB = state.routines.indexOf(b);
    state.routines[globalA] = b;
    state.routines[globalB] = a;

    saveRoutines(state.routines);
    render();
  }

  function deleteRoutine(id) {
    state.routines = state.routines.filter(function (r) { return r.id !== id; });
    saveRoutines(state.routines);
    render();
    showToast("Routine deleted.");
  }

  function addRoutine(catId) {
    var cat = CATEGORIES.find(function (c) { return c.id === catId; });
    var newRoutine = {
      id: uid(),
      category: catId,
      name: categoryMode(cat) === "month" ? "New Devotion" : "New Routine",
      subtitle: "",
      url: "",
      days: [],
      month: categoryMode(cat) === "month" ? currentMonth() : null,
      speakerGroup: ""
    };
    state.routines.push(newRoutine);
    saveRoutines(state.routines);
    render();
  }

  function exportConfig() {
    var json = JSON.stringify(state.routines, null, 2);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(json).then(function () {
        showToast("Config copied to clipboard.");
      }, function () {
        fallbackCopy(json);
      });
    } else {
      fallbackCopy(json);
    }
  }

  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
      showToast("Config copied to clipboard.");
    } catch (e) {
      showToast("Couldn't copy automatically — select the text manually.");
    }
    document.body.removeChild(ta);
  }

  function importConfig(text) {
    try {
      var parsed = JSON.parse(text);
      if (!Array.isArray(parsed)) throw new Error("not an array");
      parsed.forEach(function (r) {
        if (!r.id) r.id = uid();
        if (!Array.isArray(r.days)) r.days = [];
      });
      state.routines = parsed;
      saveRoutines(state.routines);
      render();
      showToast("Config imported.");
    } catch (e) {
      showToast("Couldn't parse that JSON.");
    }
  }

  // ---------- toast ----------

  var toastTimer = null;
  function showToast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2200);
  }

  // ---------- dom helper ----------

  function el(tag, attrs, text) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (attrs[k] === null || attrs[k] === undefined) return;
      if (k === "disabled" && attrs[k] === "") { node.disabled = true; return; }
      node.setAttribute(k, attrs[k]);
    });
    if (text !== undefined) node.textContent = text;
    return node;
  }

  // ---------- init ----------

  history.replaceState({ screen: "categories", categoryId: null }, "", "");
  render();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
